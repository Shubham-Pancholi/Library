name: CI

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-26.04
        timeout-minutes: 15

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7.0.1

            -   name: Set up JDK 21
                uses: actions/setup-java@v6.0.1
                with:
                    distribution: temurin
                    java-version: 21
                    cache: maven
            
            -   name: Build and test
                run: ./mvnw --batch-mode --no-transfer-progress verify